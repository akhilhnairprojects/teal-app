<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Teal — demo</title>
    <meta name="description" content="Teal: live T arrivals, Bluebikes and a train-or-bike planner for Boston, in one glance." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root { --bg: #061412; --border: #1c3a35; --text: #e6f4f2; --muted: #8fb3ad; --brand: #2dd4bf; }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        background: radial-gradient(80% 60% at 75% 35%, #0f2e2a 0%, var(--bg) 65%) var(--bg);
        color: var(--text);
        font-family: Manrope, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main {
        flex: 1;
        width: 100%;
        max-width: 1080px;
        margin: 0 auto;
        padding: 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 48px;
      }
      .wordmark { margin: 0; font-weight: 800; font-size: 72px; letter-spacing: -0.05em; color: #99f6e4; }
      .wordmark span { color: var(--brand); }
      .pitch { margin: 8px 0 28px; font-size: 22px; font-weight: 600; line-height: 1.4; color: var(--muted); max-width: 440px; }
      .links { display: flex; flex-wrap: wrap; gap: 10px; }
      .links a {
        padding: 10px 18px;
        border-radius: 999px;
        border: 1.5px solid var(--border);
        color: var(--text);
        font-weight: 700;
        font-size: 15px;
        text-decoration: none;
      }
      .links a.primary { background: var(--brand); border-color: var(--brand); color: #04211e; }
      .phone {
        flex: none;
        height: min(88vh, 760px);
        aspect-ratio: 390 / 844;
        padding: 11px;
        border-radius: 52px;
        background: #1b2a28;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55), inset 0 0 0 2px #2c4440;
      }
      .phone iframe { width: 100%; height: 100%; border: 0; border-radius: 42px; background: var(--bg); }
      footer { padding: 0 24px 16px; text-align: center; color: var(--muted); font-size: 13px; }
      @media (max-width: 820px) {
        main { flex-direction: column; justify-content: center; text-align: center; }
        .wordmark { font-size: 64px; }
        .pitch { margin: 8px auto 28px; }
        .phone { display: none; }
        .links { flex-direction: column; align-items: stretch; }
        .links a.primary { padding: 18px; font-size: 18px; }
        .links a:not(.primary) { border: 0; padding: 8px; color: var(--muted); }
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <p class="wordmark">teal<span>.</span></p>
        <p class="pitch">Train or bike? Live T arrivals, Bluebikes and the faster way there, on one screen.</p>
        <nav class="links">
          <a class="primary" href="/?demo">Open Teal</a>
          <a href="/">Use my location</a>
          <a href="/teal-promo.mp4">Watch the 30-s video</a>
        </nav>
      </section>
      <div class="phone" aria-label="Teal running live in an iPhone frame">
        <iframe src="/?demo" title="Teal app, live demo" loading="lazy"></iframe>
      </div>
    </main>
    <footer>Teal is an independent project and is not affiliated with the MBTA or Bluebikes. Unlock and pay in the Bluebikes app.</footer>
  </body>
</html>
